.wrap{position:relative;z-index:1}
body{background:var(--bg);background-image:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);background-attachment:fixed;min-height:100%;color:var(--ink);font-family:var(--body);font-size:1.05rem;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:grid;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.top h1{flex:1 1 auto}
.logo{width:120px;height:auto;background:#ffebea;border-radius:12px;padding:4px 8px;box-shadow:0 2px 8px rgb(160 68 168 / .18)}
h1{font-family:"Bebas Neue",var(--display);font-weight:400;letter-spacing:.02em;color:var(--accent);font-size:clamp(2.2rem,7vw,3.2rem);line-height:1;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.92rem}
.monitor{background:var(--bezel);border-radius:16px;padding:10px}
.screen{background:var(--panel);border-radius:9px;padding:clamp(16px,4vw,28px);display:grid;gap:16px;min-height:340px}
.hud{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--mono);font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hud b{color:var(--ink)}
.bar{height:8px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--soft),var(--accent));transition:width .3s}
.round{font-family:var(--mono);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.task{font-size:.95rem;color:var(--muted);margin:0}
.q{font-family:var(--display);font-weight:600;font-size:clamp(1.3rem,4.2vw,1.75rem);line-height:1.3;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.pic{font-size:3.2rem;line-height:1}
.gap{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--accent);text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.k{font:inherit;font-weight:700;text-align:left;display:flex;gap:10px;align-items:center;background:var(--key);color:var(--ink);border:1px solid var(--key-edge);border-bottom-width:5px;border-radius:9px;padding:11px 14px;cursor:pointer;transition:transform .08s,border-bottom-width .08s}
.k:hover:not(:disabled){border-color:var(--accent);background:var(--key-hover)}
.k:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.k small{font-family:var(--mono);font-weight:500;font-size:.72rem;color:var(--muted);border:1px solid var(--key-edge);border-radius:4px;padding:0 5px}
.k.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.k.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.k:disabled{cursor:default}
.k:focus-visible,.btn:focus-visible,.menu button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fb{min-height:1.6em;font-weight:700}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.fb span{font-weight:400;color:var(--muted)}
.btn{font:inherit;font-weight:700;justify-self:start;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 22px;cursor:pointer}
.menu{display:grid;gap:10px}
.menu button{font:inherit;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;align-items:center;background:var(--key);color:var(--ink);border:1px solid var(--key-edge);border-bottom-width:4px;border-radius:10px;padding:12px 14px;cursor:pointer}
.menu button:hover{border-color:var(--accent);background:var(--key-hover)}
.menu .ic{font-size:1.6rem;grid-row:span 2}
.menu .t{font-weight:700}
.menu .d{font-size:.88rem;color:var(--muted);grid-column:2}
.menu .n{grid-row:span 2;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.menu .all{border-color:var(--accent)}
.result{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,9vw,3.6rem);line-height:1;margin:0;color:var(--accent);font-variant-numeric:tabular-nums}
.review{display:grid;gap:6px;padding:0;margin:0;list-style:none;font-size:.95rem}
.review li{border-left:3px solid var(--bad);padding-left:10px}
.review b{color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.hint{font-size:.85rem;color:var(--muted)}
.type{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.type input{flex:1 1 220px;min-width:0;font:inherit;font-size:1.15rem;color:var(--ink);background:var(--key);border:1.5px solid var(--key-edge);border-radius:8px;padding:9px 12px}
.type input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.type input.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.type input.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.type .btn:disabled{opacity:.5;cursor:default}
.umlaut{display:flex;gap:6px}
.uk{font:inherit;font-weight:700;min-width:38px;background:var(--key-hover);color:var(--ink);border:1px solid var(--key-edge);border-bottom-width:4px;border-radius:7px;padding:4px 8px;cursor:pointer}
.uk:disabled{opacity:.5;cursor:default}
.uk:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

   {q:`Du brauchst die Datei nicht mehr? Dann kannst du sie ${G("…")}.`,opts:["löschen","sichern","erhalten","kopieren"],a:"löschen"},
   {q:`Du möchtest das Dokument auf Papier haben? Dann musst du es ${G("…")}.`,opts:["ausdrucken","einfügen","öffnen","senden"],a:"ausdrucken",alt:["drucken"]},
   {q:`Eine Nachricht ist auch für deine Kollegin. Du kannst sie an sie ${G("…")}.`,opts:["weiterleiten","ausschneiden","ausdrucken","speichern"],a:"weiterleiten"},
   {q:`Zuerst den Text kopieren oder ausschneiden, dann in ein neues Dokument ${G("…")}.`,opts:["einfügen","erhalten","löschen","einschalten"],a:"einfügen"},
   {q:`Ich habe heute zehn E-Mails ${G("…")}. (= bekommen)`,opts:["erhalten","geschickt","gelöscht","gedruckt"],a:"erhalten"}
  ]},
 {id:"odd",ic:"❌",t:"Was passt nicht?",d:"Ein Verb in jeder Reihe ist falsch",task:"Welches Verb passt hier nicht?",
  qs:[
   {q:"eine E-Mail …",opts:["schicken","erhalten","ausschneiden","öffnen"],a:"ausschneiden"},
   {q:"Daten …",opts:["kopieren","anschließen","löschen","speichern"],a:"anschließen"},
   {q:"einen Text …",opts:["drucken","erhalten","speichern","aufladen"],a:"aufladen"},
   {q:"den Drucker …",opts:["speichern","ausschalten","einschalten","anschließen"],a:"speichern"},
   {q:"den Laptop …",opts:["aufladen","zuklappen","weiterleiten","einschalten"],a:"weiterleiten"}
  ]},
 {id:"perf",ic:"✅",t:"Schon gemacht!",d:"Perfekt: Ich habe … eingeschaltet",task:"Ergänze das Partizip II.",
  qs:[
   {q:`Ich habe den Computer schon vor 15 Minuten ${G("…")}.`,opts:["eingeschaltet","geeinschaltet","eingeschalten","einschaltet"],a:"eingeschaltet"},
   {q:`Ich habe den Drucker vor 10 Minuten ${G("…")}.`,opts:["ausgeschaltet","geausschaltet","ausschaltet","ausgeschalten"],a:"ausgeschaltet"},
   {q:`Ich habe den Vertrag gestern ${G("…")}.`,opts:["ausgedruckt","geausdruckt","ausdruckt","ausgedrucken"],a:"ausgedruckt"},
   {q:`Ich habe den Text ${G("…")} und gespeichert.`,opts:["kopiert","gekopiert","kopieren","gekopieret"],a:"kopiert"},
   {q:`Ich habe die Antwort von Frau Weber ${G("…")}.`,opts:["weitergeleitet","geweiterleitet","weiterleitet","weitergeleiten"],a:"weitergeleitet"},
   {q:`Ich habe die E-Mail vor 3 Minuten ${G("…")}.`,opts:["geschickt","geschicken","schickte","gschickt"],a:"geschickt"},
   {q:`Ich habe die alte Datei ${G("…")}.`,opts:["gelöscht","löschte","gelöschen","geloscht"],a:"gelöscht"},
   {q:`Ich habe den Laptop ${G("…")}. Der Akku ist wieder voll.`,opts:["aufgeladen","geaufladet","aufgeladet","aufladen"],a:"aufgeladen"}
  ]}
];

const S=document.getElementById("screen");
let st=null;

function menu(){
  st=null;
  const total=ROUNDS.reduce((n,r)=>n+Math.min(r.qs.length,r.id==="art"?10:99),0);
  S.innerHTML=`<p class="round">Wähle eine Runde</p>
  <div class="menu">${ROUNDS.map((r,i)=>`<button data-r="${i}"><span class="ic" aria-hidden="true">${r.ic}</span><span class="t">${r.t}</span><span class="n">${r.id==="art"?10:r.qs.length} Fragen</span><span class="d">${r.d}</span></button>`).join("")}</div>`;
}

function start(key){
  let qs;
  if(key==="all") qs=shuffle(ROUNDS.flatMap(r=>r.qs.map(q=>({...q,r}))) ).slice(0,15);
  else { const r=ROUNDS[key]; qs=shuffle(r.qs).slice(0,r.id==="art"?10:99).map(q=>({...q,r})); }
  st={key,qs,i:0,score:0,streak:0,best:0,miss:[],done:false};
  ask();
}

function ask(){
  const q=st.qs[st.i]; st.done=false; st.tried=false;
  const opts=q.keep?q.opts:shuffle(q.opts);
  st.cur=opts;
  S.innerHTML=`
  <div class="hud"><span>Frage <b>${st.i+1}/${st.qs.length}</b></span><span>Punkte <b>${st.score}</b></span><span>Serie <b>${st.streak}</b>${st.streak>=3?" 🔥":""}</span></div>
  <div class="bar"><i style="width:${st.i/st.qs.length*100}%"></i></div>
  <p class="round">${q.r.ic} ${q.r.t}</p>
  <p class="task">${q.task||q.r.task}</p>
  ${q.pic?`<div class="pic" aria-hidden="true">${q.pic}</div>`:""}
  <p class="q">${q.q}</p>
  ${q.r.input?`<form class="type" id="tf" autocomplete="off">
      <label for="ans" class="sr">Deine Antwort</label>
      <input id="ans" placeholder="Verb schreiben …" spellcheck="false" autocapitalize="off">
      <button class="btn" type="submit">Prüfen</button>
      <button class="btn ghost" type="button" id="help">Hilfe</button>
    </form>
    <div class="umlaut" aria-label="Umlaute">${["ä","ö","ü","ß"].map(c=>`<button type="button" class="uk" data-u="${c}">${c}</button>`).join("")}</div>`:""}
  <div class="opts"${q.r.input?" hidden":""}>${opts.map((o,i)=>`<button class="k" data-o="${i}"><small>${i+1}</small>${o}</button>`).join("")}</div>
  <div class="fb" id="fb"></div>`;
  (S.querySelector("#ans")||S.querySelector(".k")).focus({preventScroll:true});
}

const norm=s=>s.toLowerCase().trim().replace(/\s+/g," ").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");

function answer(idx,typed){
  if(!st||st.done) return;
  const q=st.qs[st.i];
  let pick, ok;
  if(typed!==undefined){
    if(!typed.trim()){ const fb=document.getElementById("fb"); fb.className="fb bad"; fb.innerHTML="Schreib zuerst ein Wort."; return; }
    ok=[q.a,...(q.alt||[])].some(w=>norm(w)===norm(typed));
    pick=ok?q.a:null;
    const inp=document.getElementById("ans"); inp.disabled=true; inp.classList.add(ok?"right":"wrong");
    S.querySelectorAll("#tf button").forEach(b=>b.disabled=true);
    S.querySelectorAll(".uk").forEach(b=>b.disabled=true);
    if(!ok){
      // second chance: show the hidden options instead of ending the question
      st.tried=true; st.streak=0; st.miss.push(q);
      const o=S.querySelector(".opts"); o.hidden=false;
      const fb=document.getElementById("fb"); fb.className="fb bad";
      fb.innerHTML=`Leider falsch. <span>Wähle jetzt das richtige Wort.</span>`;
      S.querySelector(".k").focus({preventScroll:true});
      return;
    }
  } else { pick=st.cur[idx]; if(pick===undefined) return; ok=pick===q.a;
    S.querySelectorAll("#tf input,#tf button,.uk").forEach(el=>el.disabled=true); }
  st.done=true;
  S.querySelectorAll(".k").forEach((b,i)=>{b.disabled=true; if(st.cur[i]===q.a) b.classList.add("right"); else if(i===idx) b.classList.add("wrong");});
  const fb=document.getElementById("fb");
  if(ok && typed!==undefined && typed.trim()!==q.a && !(q.alt||[]).includes(typed.trim())) q.spell=true; else q.spell=false;
  if(st.tried){
    fb.className=ok?"fb ok":"fb bad";
    fb.innerHTML=ok?`Jetzt stimmt es! <span>Merke dir: ${q.a}</span>`:`Leider falsch. <span>Richtig ist: ${q.a}</span>`;
  } else if(ok){ st.score++; st.streak++; st.best=Math.max(st.best,st.streak);
    fb.className="fb ok"; fb.innerHTML=["Richtig!","Super!","Genau!","Prima!","Sehr gut!"][Math.floor(Math.random()*5)]+(q.full?` <span>${q.full}</span>`:"")+(q.spell?` <span>Achte auf die Schreibweise: ${q.a}</span>`:""); }
  else { st.streak=0; st.miss.push(q);
    fb.className="fb bad"; fb.innerHTML=`Leider falsch. <span>Richtig ist: ${q.full||q.a}</span>`; }
  const last=st.i===st.qs.length-1;
  fb.insertAdjacentHTML("afterend",`<button class="btn" id="next">${last?"Ergebnis zeigen":"Weiter"}</button>`);
  document.getElementById("next").focus({preventScroll:true});
}

function next(){
  if(!st||!st.done) return;
  if(st.i<st.qs.length-1){st.i++;ask();} else result();
}

function result(){
  const n=st.qs.length, p=Math.round(st.score/n*100);
  const msg=p===100?"Perfekt! Du kennst alle Wörter. 🏆":p>=80?"Sehr gut! Fast alles richtig.":p>=50?"Gut! Wiederhole noch die Fehler.":"Weiter üben, du schaffst das!";
  S.innerHTML=`<p class="round">Ergebnis</p>
  <p class="result">${st.score}/${n}</p>
  <p class="q">${msg}</p>
  <p class="task">Längste Serie: ${st.best} richtige Antworten hintereinander.</p>
  ${st.miss.length?`<p class="task">Diese Wörter solltest du wiederholen:</p><ul class="review">${st.miss.map(q=>`<li>${q.q.replace(/<[^>]+>/g,"").replace("___","…")} → <b>${q.full||q.a}</b></li>`).join("")}</ul>`:""}
  <div class="row">${st.miss.length?`<button class="btn" id="retry">Fehler üben</button>`:""}<button class="btn ${st.miss.length?"ghost":""}" id="again">Noch einmal</button><button class="btn ghost" id="home">Andere Runde</button></div>`;
}

S.addEventListener("submit",e=>{
  e.preventDefault();
  const inp=document.getElementById("ans"); if(inp) answer(undefined,inp.value);
});
S.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.id==="help"){ const o=S.querySelector(".opts"); o.hidden=!o.hidden; t.textContent=o.hidden?"Hilfe":"Hilfe ausblenden"; return; }
  if(t.dataset.u){ const inp=document.getElementById("ans"); const s=inp.selectionStart??inp.value.length, en=inp.selectionEnd??s;
    inp.value=inp.value.slice(0,s)+t.dataset.u+inp.value.slice(en); inp.focus(); inp.setSelectionRange(s+1,s+1); return; }
  if(t.dataset.r!==undefined) start(t.dataset.r==="all"?"all":+t.dataset.r);
  else if(t.dataset.o!==undefined) answer(+t.dataset.o);
  else if(t.id==="next") next();
  else if(t.id==="again") start(st.key);
  else if(t.id==="home") menu();
  else if(t.id==="retry"){ const m=shuffle(st.miss); st={key:st.key,qs:m,i:0,score:0,streak:0,best:0,miss:[],done:false}; ask(); }
});
document.addEventListener("keydown",e=>{
  if(!st) return;
  const opts=S.querySelector(".opts");
  if(!st.done && /^[1-4]$/.test(e.key) && e.target.tagName!=="INPUT" && opts && !opts.hidden) answer(+e.key-1);
  else if(st.done && e.key==="Enter" && document.getElementById("next")){ e.preventDefault(); next(); }
});
menu();
</script>

</body></html>
